# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'

name: foundry-hosted-agents-activity-model

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10

  activity-model:
    host: azure.ai.agent
    metadata:
      tags:
        - Activity Protocol
        - AI Agent Hosting
        - Microsoft Teams
        - Python
    project: src/activity-model
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    kind: hosted
    name: activity-model
    displayName: Activity Model (Python)
    description: >
      A minimal Activity protocol agent for Teams that maps each channel
      conversation to a project-scoped OpenAI Responses conversation.
    protocols:
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4-mini}
      ENABLE_INSTRUMENTATION: 'true'
      ENABLE_SENSITIVE_DATA: 'false'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry

hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/Grant-AgentProjectAccess.ps1
    posix:
      shell: sh
      run: ./scripts/grant-agent-project-access.sh
