[project]
name = "foundry-hosted-agents-activity-model"
version = "0.1.0"
description = "A Microsoft Foundry Activity agent with project-backed model history"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-ai-agentserver-activity==1.0.0b4",
    "azure-ai-projects==2.11.0",
    "azure-identity==1.27.0",
    "httpx==0.28.1",
    "microsoft-agents-hosting-core==1.9.0",
    "openai==3.50.0",
    "opentelemetry-api==1.45.2",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
]

[tool.uv]
package = false
