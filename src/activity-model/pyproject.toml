[project]
name = "foundry-hosted-agents-activity-model"
version = "0.1.0"
description = "A Microsoft Foundry Activity agent with project-backed model history"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-ai-agentserver-activity==1.0.0b3",
    "azure-ai-projects==2.6.1",
    "azure-identity==1.25.1",
    "httpx==0.28.1",
    "microsoft-agents-hosting-core==1.7.0",
    "openai==3.0.0",
    "opentelemetry-api==1.44.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "debugpy==1.8.20",
]

[tool.uv]
package = false